services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: wikicompare-experiment-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      EXPERIMENT_DATA_DIR: /app/server/experiment_data
      EXPERIMENT_CORS_ORIGIN: "*"
      TORNADO_DEBUG: "0"
    volumes:
      - /opt/wikicompare-experiment/experiment_data:/app/server/experiment_data
    expose:
      - "8888"

  frontend:
    image: nginx:1.27-alpine
    container_name: wikicompare-experiment-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8991:80"
    volumes:
      - ./client/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
